<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mine Archeologo – missioni di scavo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b1d12;
  --ui:#c6c6c6; --ui-hi:#ffffff; --ui-lo:#555555; --ui-text:#3f3f3f;
  --slot:#8b8b8b; --slot-hi:#ffffff; --slot-lo:#373737;
  --btn:#727272; --btn-hi:#a8a8a8; --btn-lo:#3c3c3c;
  --btn-hover:#7280c8; --btn-hover-hi:#b9c2f0; --btn-hover-lo:#36407a;
  --gold:#ffd83d; --yellow:#ffff55; --aqua:#55ffff; --green:#55ff55; --red:#ff5555;
  --tip:#100010; --tip-border:#3a1490;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ height:100%; }
body{
  margin:0; min-height:100%; background-color:var(--bg); color:#fff;
  font-family:'Pixelify Sans','Trebuchet MS',sans-serif; font-size:20px; line-height:1.3;
  image-rendering:pixelated; background-size:auto, 64px 64px;
}
.wrap{ max-width:900px; margin:0 auto; padding:16px 14px 28px; }
.screen{
  position:relative; min-height:580px; padding:14px; overflow:hidden;
  background:rgba(0,0,0,.30); border:3px solid #000; box-shadow:inset 0 0 0 3px rgba(255,255,255,.07);
}
.px{ font-family:'Press Start 2P','Courier New',monospace; line-height:1.5; font-weight:normal; }
canvas, img.sp{ image-rendering:pixelated; image-rendering:crisp-edges; }
.shadow{ text-shadow:2px 2px 0 #3f3f3f; }

/* ---------- pulsanti a blocchi ---------- */
button{
  font-family:inherit; font-size:19px; line-height:1.2; color:#fff; text-shadow:2px 2px 0 #3f3f3f;
  background:var(--btn); border:2px solid #000; border-radius:0; padding:9px 14px 10px; cursor:pointer;
  box-shadow:inset 2px 2px 0 var(--btn-hi), inset -2px -3px 0 var(--btn-lo);
}
button:hover{ background:var(--btn-hover); color:#ffffa0; box-shadow:inset 2px 2px 0 var(--btn-hover-hi), inset -2px -3px 0 var(--btn-hover-lo); }
button:active{ box-shadow:inset 2px 3px 0 var(--btn-lo), inset -2px -2px 0 var(--btn-hi); }
button:disabled{ background:#2c2c2c; color:#9a9a9a; text-shadow:none; cursor:not-allowed; box-shadow:inset 2px 2px 0 #3a3a3a, inset -2px -2px 0 #1a1a1a; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible{ outline:3px solid var(--yellow); outline-offset:2px; }
button.big{ font-size:23px; padding:12px 24px 13px; }
button.small{ font-size:15px; padding:5px 9px 6px; }
button.green, .opts button.ok, .stack button.done{ background:#3f8a2e; box-shadow:inset 2px 2px 0 #7fd25e, inset -2px -3px 0 #1f4a16; color:#fff; }
.opts button.no{ background:#9a3a2e; box-shadow:inset 2px 2px 0 #d97a6a, inset -2px -3px 0 #4a1610; color:#fff; }

/* ---------- pannelli stile inventario ---------- */
.panel{
  background:var(--ui); color:var(--ui-text); border:2px solid #000; padding:12px 14px;
  box-shadow:inset 3px 3px 0 var(--ui-hi), inset -3px -3px 0 var(--ui-lo);
}
.panel h2{ font-family:'Press Start 2P','Courier New',monospace; font-size:11px; color:var(--ui-text); margin:0 0 10px; font-weight:normal; line-height:1.5; }
.slot{ background:var(--slot); box-shadow:inset 2px 2px 0 var(--slot-lo), inset -2px -2px 0 var(--slot-hi); }

/* ---------- HUD ---------- */
.hud{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.hud .info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.hud .mname{ font-size:10px; color:var(--yellow); text-shadow:2px 2px 0 #3f3f00; }
.hud .day{ font-size:20px; text-shadow:2px 2px 0 #3f3f3f; }
.hotbar{ display:flex; flex-wrap:wrap; padding:3px; background:#000; border:2px solid #555; }
.hotbar .slot{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.hotbar img{ width:30px; height:30px; opacity:.28; filter:grayscale(1) brightness(.7); }
.hotbar img.got{ opacity:1; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.45)); animation:pop .4s; }
@keyframes pop{ 50%{ transform:scale(1.35); } }
.hud .btns{ display:flex; gap:8px; }

/* ---------- dialogo (tooltip) ---------- */
.dialog{
  margin-top:14px; background:rgba(16,0,16,.94); border:3px solid var(--tip-border); outline:3px solid var(--tip);
  display:grid; grid-template-columns:72px 1fr; gap:12px; padding:10px 12px; min-height:114px; align-items:start;
}
.dialog .face{ width:72px; height:98px; display:flex; align-items:center; justify-content:center; }
.dialog .face canvas{ width:48px; height:72px; }
.dialog .who{ font-size:10px; color:var(--yellow); margin-bottom:6px; }
.dialog .txt{ font-size:22px; min-height:58px; }
.dialog .row{ display:flex; justify-content:flex-end; margin-top:6px; }

/* ---------- caricamento ---------- */
.loading{ min-height:470px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; }
.loading .lt{ font-size:13px; text-shadow:2px 2px 0 #3f3f3f; }
.loading .ls{ font-size:20px; color:#d0d0d0; min-height:26px; }
.loadbar{ width:min(380px, 90%); height:14px; background:#000; border:2px solid #fff; }
.loadbar span{ display:block; height:100%; width:0; background:var(--green); }

/* ---------- titolo ---------- */
.title{ text-align:center; }
.pano-wrap{ position:relative; border:3px solid #000; }
.pano{ width:100%; height:auto; aspect-ratio:320/120; display:block; }
.logo{ position:absolute; left:0; right:0; top:7%; text-align:center; pointer-events:none; }
.logo h1{
  margin:0; font-size:clamp(20px, 5.4vw, 44px); color:transparent;
  background:var(--logo-tex, #d0d0d0) 0 0/28px 28px; -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(3px 0 0 #000) drop-shadow(-3px 0 0 #000) drop-shadow(0 3px 0 #000) drop-shadow(0 -3px 0 #000) drop-shadow(4px 5px 0 #3a3a3a);
  letter-spacing:2px;
}
.splash{
  position:absolute; right:5%; top:44%; color:var(--yellow); font-size:clamp(8px,1.7vw,13px);
  text-shadow:2px 2px 0 #3f3f00; transform:rotate(-14deg); animation:splash .45s ease-in-out infinite alternate; pointer-events:none;
}
@keyframes splash{ to{ transform:rotate(-14deg) scale(1.12); } }
.team-row{ display:flex; justify-content:center; gap:24px; margin:16px 0 8px; flex-wrap:wrap; }
.team-row figure{ margin:0; text-align:center; }
.team-row canvas{ width:60px; height:90px; display:block; margin:0 auto 6px; filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45)); }
.team-row figcaption{ font-size:18px; color:#e8e8e8; text-shadow:2px 2px 0 #3f3f3f; }
.team-row figcaption b{ display:block; font-family:'Press Start 2P','Courier New',monospace; font-size:10px; color:var(--yellow); font-weight:normal; margin-bottom:3px; }
.namebox{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; margin:10px auto 4px; max-width:560px; }
.namebox label{ font-size:22px; width:100%; text-shadow:2px 2px 0 #3f3f3f; }
.namebox input{
  font-family:'Pixelify Sans','Trebuchet MS',sans-serif; font-size:24px; background:#000; color:#fff;
  border:2px solid #a0a0a0; outline:2px solid #000; padding:6px 10px; width:min(280px, 100%);
}

/* ---------- menu missioni ---------- */
.menu-h{ font-size:clamp(11px,2.2vw,15px); color:var(--yellow); text-shadow:2px 2px 0 #3f3f00; margin:4px 0 6px; text-align:center; }
.menu-sub{ text-align:center; margin:0 0 14px; font-size:19px; text-shadow:2px 2px 0 #3f3f3f; }
.missions{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; }
button.mcard{
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px 10px; text-align:center;
  background:var(--ui); color:var(--ui-text); text-shadow:none;
  box-shadow:inset 3px 3px 0 var(--ui-hi), inset -3px -3px 0 var(--ui-lo);
}
button.mcard:hover{ background:#dcdcdc; color:var(--ui-text); box-shadow:inset 3px 3px 0 #fff, inset -3px -3px 0 #777; outline:3px solid #fff; }
.mcard canvas{ width:64px; height:64px; border:2px solid #000; }
.mcard .mn{ font-family:'Press Start 2P','Courier New',monospace; font-size:8px; color:#6a6a6a; }
.mcard .mt{ font-size:19px; font-weight:700; line-height:1.1; }
.mcard .me{ font-size:15px; color:#5a5a5a; line-height:1.15; }
.mstars{ font-size:20px; letter-spacing:2px; color:#8a8a8a; }
.mstars b{ color:#e0a800; font-weight:normal; text-shadow:1px 1px 0 #6a4a00; }
.timeline{ display:flex; align-items:center; gap:10px; margin:12px 4px 0; font-size:9px; color:#fff; text-shadow:2px 2px 0 #000; }
.timeline i{ flex:1; height:6px; background:repeating-linear-gradient(90deg, #fff 0 12px, transparent 12px 18px); position:relative; }
.timeline i::after{ content:""; position:absolute; right:-6px; top:-6px; border:9px solid transparent; border-left-color:#fff; border-right:0; }
.menu-act{ display:flex; justify-content:center; margin-top:14px; }

/* ---------- mappa ---------- */
.map-wrap{ display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:14px; }
.map-wrap canvas{ width:100%; height:auto; aspect-ratio:320/200; display:block; border:3px solid #000; }
.side .stack{ display:flex; flex-direction:column; gap:8px; }
.side .stack button{ text-align:left; }
.zones{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.zones button{ flex:1 1 170px; }
.hint{ font-size:18px; margin:10px 0 0; }

/* ---------- griglia di scavo ---------- */
.dig{ display:grid; grid-template-columns:minmax(0,1fr) 262px; gap:14px; align-items:start; }
.frame{ display:grid; grid-template-columns:22px minmax(0,1fr); grid-template-rows:22px auto; gap:4px; }
.frame .cols{ grid-column:2; display:grid; grid-template-columns:repeat(8, 1fr); text-align:center; font-family:'Press Start 2P','Courier New',monospace; font-size:10px; color:#fff; text-shadow:2px 2px 0 #000; align-items:end; }
.frame .rows{ grid-row:2; display:grid; grid-template-rows:repeat(6, 1fr); font-family:'Press Start 2P','Courier New',monospace; font-size:10px; color:#fff; text-shadow:2px 2px 0 #000; align-items:center; text-align:center; }
.frame .lbl-hidden{ visibility:hidden; }
.area{ grid-column:2; grid-row:2; position:relative; display:grid; grid-template-columns:repeat(8, 1fr); background:#000; border:3px solid #000; }
.cell, .cell:hover, .cell:active{
  aspect-ratio:1; border:0; padding:0; margin:0; position:relative; border-radius:0; text-shadow:none;
  background:var(--img, #5b8f2f) center/100% 100% no-repeat; image-rendering:pixelated;
  box-shadow:var(--sh); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.cell:hover{ filter:brightness(1.18); box-shadow:var(--sh), inset 0 0 0 2px rgba(255,255,255,.9); }
.strung .cell{ outline:1px dashed rgba(255,255,255,.75); outline-offset:-1px; }
.cell img{ width:68%; height:68%; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.5)); position:relative; z-index:1; }
.cell img.pending{ animation:blink .6s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.cell .flag{ position:absolute; right:3px; top:3px; width:10px; height:10px; background:var(--gold); border:2px solid #000; z-index:1; }
.cell.hint-on::after{ content:""; position:absolute; inset:2px; border:3px solid var(--aqua); pointer-events:none; animation:blink 1.2s steps(1) infinite; }
.cell.target{ outline:3px solid var(--yellow) !important; outline-offset:-3px; }
.cell.digging::before{ content:""; position:absolute; inset:3px; border:2px dashed var(--yellow); animation:blink .4s steps(1) infinite; pointer-events:none; }
button.peg, button.peg:hover{
  position:absolute; width:22px; height:22px; padding:0; z-index:3; background:#8a5a2b;
  border:3px solid var(--yellow); box-shadow:inset -3px -3px 0 #5a3a1a; animation:blink .9s steps(1) infinite;
}
button.peg.set{ border-color:#000; animation:none; cursor:default; background:#a87a42; }
.peg.tl{ left:-11px; top:-11px; } .peg.tr{ right:-11px; top:-11px; }
.peg.bl{ left:-11px; bottom:-11px; } .peg.br{ right:-11px; bottom:-11px; }

.legend{ margin-top:12px; display:grid; gap:6px; }
.legend div{ display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:center; font-size:18px; }
.legend i{ display:block; width:28px; height:28px; border:2px solid #000; background-size:100% 100%; image-rendering:pixelated; }

.cards{ display:flex; flex-direction:column; gap:8px; }
.card{
  background:var(--slot); box-shadow:inset 2px 2px 0 var(--slot-lo), inset -2px -2px 0 var(--slot-hi);
  padding:8px; display:grid; grid-template-columns:40px 1fr; gap:8px; cursor:pointer; color:#fff; text-shadow:2px 2px 0 #3f3f3f;
  border:3px solid transparent;
}
.card.sel{ border-color:#fff; outline:2px solid #000; }
.card canvas{ width:36px; height:54px; }
.card .nm{ font-family:'Press Start 2P','Courier New',monospace; font-size:10px; color:var(--yellow); }
.card .fr{ font-size:16px; }
.pips{ display:flex; gap:2px; margin:4px 0 6px; }
.pips span{ width:12px; height:10px; background:#80ff20; border:1px solid #000; box-shadow:inset -2px -2px 0 #3a8a10; }
.pips span.off{ background:#2a2a2a; box-shadow:none; }
.card button{ font-size:14px; padding:4px 6px 5px; width:100%; }
.howto{ font-size:17px; margin-top:10px; }

/* ---------- finestre (schede) ---------- */
.modal{ position:absolute; inset:0; background:rgba(0,0,0,.66); display:flex; align-items:center; justify-content:center; padding:14px; z-index:20; }
.sheet{ width:min(580px, 100%); max-height:100%; overflow:auto; }
.sheet h2{ font-size:12px; }
.sheet p{ margin:6px 0; font-size:20px; }
.sheet .q{ margin:12px 0 4px; font-size:20px; font-weight:700; }
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.fb{ min-height:26px; font-size:19px; color:#2a5a1a; font-weight:600; margin-top:6px; }
.fact{ background:#e8e8e8; border:2px solid #8b8b8b; padding:6px 10px; font-size:18px !important; }
.fact b{ color:#7a5a00; }
.photo{ display:flex; gap:14px; align-items:center; margin:8px 0; }
.photo .frame-img{ background:#fff; padding:8px 8px 22px; border:2px solid #000; position:relative; flex:none; }
.photo .frame-img canvas{ width:80px; height:80px; display:block; background-size:100% 100%; image-rendering:pixelated; }
.photo .frame-img.blank canvas{ filter:brightness(0); }
.flash{ position:absolute; inset:0; background:#fff; animation:flash .5s forwards; pointer-events:none; }
@keyframes flash{ to{ opacity:0; } }
.sheet .act{ display:flex; justify-content:flex-end; gap:10px; margin-top:12px; flex-wrap:wrap; }
.diary li{ font-size:19px; margin:4px 0; }
.diary ul{ padding-left:22px; margin:6px 0; }
.sketches{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
.sketches img{ width:36px; height:36px; padding:3px; }
.stars{ font-size:40px; color:#7a7a7a; letter-spacing:8px; margin:6px 0; text-shadow:3px 3px 0 #000; }
.stars b{ color:var(--gold); font-weight:normal; }
.shake{ animation:shake .3s; }
@keyframes shake{ 25%{ transform:translateX(-5px);} 75%{ transform:translateX(5px);} }
.brush{ position:relative; width:160px; height:160px; margin:8px auto; border:3px solid #000; }
.brush canvas{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
#bDirt{ cursor:crosshair; touch-action:none; }
.bar{ height:14px; background:#000; margin:8px auto; width:160px; border:2px solid #000; }
.bar span{ display:block; height:100%; width:0; background:#80ff20; }

/* ---------- personaggi sulla griglia ---------- */
.actors{ position:absolute; inset:0; pointer-events:none; z-index:2; }
.actor{ position:absolute; width:12.5%; aspect-ratio:2/3; transform:translateY(-100%); }
.actor img{ width:100%; height:100%; display:block; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4)); }
.actor.sel::before{
  content:""; position:absolute; left:50%; top:-14px; width:10px; height:10px; margin-left:-5px;
  background:var(--green); border:2px solid #000; animation:bob 1s ease-in-out infinite;
}
@keyframes bob{ 50%{ top:-20px; } }
.actor .tag{ position:absolute; left:50%; bottom:-14px; transform:translateX(-50%); background:rgba(0,0,0,.6); color:#fff;
  font-family:'Press Start 2P','Courier New',monospace; font-size:7px; padding:2px 4px; white-space:nowrap; }
.actor .bubble{ position:absolute; bottom:100%; left:50%; transform:translate(-50%, -18px); background:rgba(16,0,16,.92); color:#fff;
  border:2px solid var(--tip-border); font-size:17px; padding:1px 7px; white-space:nowrap; z-index:5; }
.actor .bubble.edge-l{ left:0; transform:translate(0, -18px); }
.actor .bubble.edge-r{ left:auto; right:0; transform:translate(0, -18px); }
.dirt{ position:absolute; width:6px; height:6px; animation:dirt .6s ease-out forwards; }
@keyframes dirt{ 50%{ transform:translate(calc(var(--dx) * .6), var(--dy)); } 100%{ transform:translate(var(--dx), 8px); opacity:0; } }

@media (max-width:760px){
  .missions{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  .missions .mcard:last-child{ grid-column:1 / -1; }
}
@media (max-width:680px){
  .map-wrap, .dig{ grid-template-columns:1fr; }
  .cards{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; }
  .card{ grid-template-columns:1fr; text-align:center; padding:6px; }
  .card canvas{ margin:0 auto; }
  .card .fr{ display:none; }
  .pips{ justify-content:center; }
  .screen{ padding:10px; }
  body{ font-size:19px; }
  .dialog{ grid-template-columns:50px 1fr; }
  .dialog .face{ width:50px; height:72px; }
  .dialog .face canvas{ width:36px; height:54px; }
  .dialog .txt{ font-size:20px; }
  .actor .tag{ display:none; }
  .actor .bubble{ font-size:15px; }
  .hotbar .slot{ width:34px; height:34px; }
  .hotbar img{ width:26px; height:26px; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <main class="screen" id="screen">
    <div class="hud" id="hud" hidden>
      <div class="info">
        <span class="mname px" id="mname"></span>
        <span class="day" id="day">Giorno 1</span>
      </div>
      <div class="hotbar" id="slots" aria-label="Reperti trovati"></div>
      <div class="btns">
        <button class="small" id="menuBtn" type="button">Missioni</button>
        <button class="small" id="soundBtn" type="button">Suono: sì</button>
      </div>
    </div>
    <div id="view"></div>
    <section class="dialog" id="dialog" hidden aria-live="polite">
      <div class="face slot" id="face"></div>
      <div>
        <div class="who px" id="who"></div>
        <div class="txt" id="txt"></div>
        <div class="row"><button id="nextBtn" type="button" hidden>Avanti</button></div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
'use strict';
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* =========================================================
   SALVATAGGIO (solo comodità: il gioco funziona anche senza)
   ========================================================= */
const KEY = 'minearcheologo.v1';
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function saveProgress(){ try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){} }
const progress = loadProgress();
progress.stars = progress.stars || {};

/* =========================================================
   TEXTURE A BLOCCHI (generate dal codice)
   ========================================================= */
const PAL = {
  grass:['#5b8f2f','#6aa339','#4f7f28','#77b043','#5f9a33'],
  grassDark:['#3f6f22','#4a7d28','#376320','#52862e'],
  dirt:['#866043','#79553a','#96704f','#6b4a30'],
  coarse:['#8a5a3a','#7a4e32','#9a6a48','#6a4028','#a07858'],
  gravel:['#857f7b','#6f6a66','#9a9490','#5e5955','#a9a29c'],
  clay:['#a0603e','#ae6a46','#94573a','#b87452'],

function noiseFill(x, s, r, pal){

}
const DRAW = {
  grassSide(x, s, r){
    noiseFill(x, s, r, PAL.dirt);
    for (let i = 0; i < s; i++){
      const d = Math.round(s * .22) + (r() < .5 ? 1 : 0) + (r() < .25 ? 1 : 0);
      for (let j = 0; j < d; j++){ x.fillStyle = PAL.grass[(r() * PAL.grass.length) | 0]; x.fillRect(i, j, 1, 1); }

  },
  leaves(x, s, r){ noiseFill(x, s, r, PAL.leaves); x.fillStyle = '#1d3a10'; for (let k = 0; k < s * s * .12; k++) x.fillRect((r() * s) | 0, (r() * s) | 0, 1, 1); },

  planks(x, s, r){
    const b = Math.max(2, s / 4 | 0);

      x.fillStyle = j % b === b - 1 ? '#6b4f2a' : PAL.planks[((j / b | 0) + (r() < .15 ? 1 : 0)) % PAL.planks.length]; x.fillRect(i, j, 1, 1);

  },
  roof(x, s, r){

    for (let j = 0; j < s; j += b){ x.fillRect(0, j + b - 1, s, 1); const off = (j / b) % 2 ? b : 0; for (let i = off; i < s; i += b * 2) x.fillRect(i, j, 1, b); }

  wheat(x, s, r){

  },
  farm(x, s, r){ for (let j = 0; j < s; j++) for (let i = 0; i < s; i++){ x.fillStyle = j % 3 === 0 ? PAL.farm[(r() * 3) | 0] : PAL.crop[(r() * 3) | 0]; x.fillRect(i, j, 1, 1); } },
  palm(x, s, r){

    x.fillStyle = '#2a5418'; x.fillRect(c - 3, c, 1, 1); x.fillRect(c + 3, c, 1, 1); x.fillStyle = '#6b4f2a'; x.fillRect(c - 1, c - 1, 2, 2);
  },
  tufo(x, s, r){ noiseFill(x, s, r, PAL.tufo); x.fillStyle = '#8a6a3a'; for (let k = 0; k < s * s * .05; k++) x.fillRect((r() * s) | 0, (r() * s) | 0, 2, 1); },
  sandstone(x, s, r){ for (let j = 0; j < s; j++) for (let i = 0; i < s; i++){ x.fillStyle = PAL.sandstone[(((j / 2) | 0) + (r() < .3 ? 1 : 0)) % 4]; x.fillRect(i, j, 1, 1); } },

   ========================================================= */
let ac = null, soundOn = true;
function tone(f, d, delay, type){
  if (!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.06, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
  }catch(e){}
}
const sfx = {
  blip(){ tone(880, .05); },
  dig(){ tone(220, .06); tone(160, .08, .06); tone(110, .1, .13); },
  find(){ [523,659,784,1047].forEach((f,i) => tone(f, .12, i*.09)); },
  bad(){ tone(140, .25, 0, 'sawtooth'); },
  ok(){ tone(660, .08); tone(990, .12, .08); },
  photo(){ tone(1800, .03); tone(1200, .05, .04); },
  win(){ [392,523,659,784,659,784,1047].forEach((f,i) => tone(f, .16, i*.14)); }
};

});

   ========================================================= */
const dlg = $('dialog'), txtEl = $('txt'), whoEl = $('who'), faceEl = $('face'), nextBtn = $('nextBtn');
let queue = [], onDone = null, typing = null, fullText = '';
function setSpeaker(who){
  faceEl.innerHTML = '';
  faceEl.appendChild(charCanvas(who, 4)); whoEl.textContent = teamOf(who).name;
}
function typeText(text){
  clearInterval(typing); typing = null; fullText = text;
  if (reduce){ txtEl.textContent = text; return; }
  let i = 0; txtEl.textContent = '';
  typing = setInterval(() => { i += 2; txtEl.textContent = text.slice(0, i); if (i >= text.length){ clearInterval(typing); typing = null; } }, 22);
}
function say(who, text){ dlg.hidden = false; queue = []; onDone = null; nextBtn.hidden = true; setSpeaker(who); typeText(text); }
function talk(lines, done){ dlg.hidden = false; queue = lines.slice(); onDone = done || null; nextLine(); }
function nextLine(){
  if (!queue.length){ nextBtn.hidden = true; const d = onDone; onDone = null; if (d) d(); return; }
  const [who, text] = queue.shift();
  setSpeaker(who); typeText(text); nextBtn.hidden = false;
  nextBtn.textContent = queue.length || onDone ? 'Avanti' : 'Ok';
}
nextBtn.addEventListener('click', () => {
  sfx.blip();
  if (typing){ clearInterval(typing); typing = null; txtEl.textContent = fullText; return; }
  nextLine();
});
function hideDialog(){ dlg.hidden = true; queue = []; onDone = null; clearInterval(typing); typing = null; }

  return { mission:m, day:1, depth:Array.from({length:COLS}, () => Array(ROWS).fill(0)),
    finds:[], pendings:[], reached:{}, energy:{paul:6, laura:6, muhammad:6}, used:{}, hints:[], sel:'laura',
    dugTotal:0, dugToday:0, todayFinds:[], allDays:[], phase:'intro' };
}
function placeFinds(){
  const used = { 1:new Set(), 2:new Set(), 3:new Set() };
  function put(type, layer, cMin, cMax, rMin, rMax){
    let c, r, k;
    do { c = cMin + rnd(cMax - cMin + 1); r = rMin + rnd(rMax - rMin + 1); k = c + ',' + r; } while (used[layer].has(k));
    used[layer].add(k);
    S.finds.push({ type, col:c, row:r, layer, found:false, documented:false });
  }
  S.mission.targets.forEach(t => { for (let i = 0; i < t.n; i++) put(t.type, 3, 1, 6, 1, 4); });
  S.mission.decoys1.forEach(t => put(t, 1, 0, 7, 0, 5));
  S.mission.decoys2.forEach(t => put(t, 2, 0, 7, 0, 5));
}
const leftOf = type => S.finds.filter(f => f.type === type && !f.documented).length;

function drawPano(cv, t){
  const x = cv.getContext('2d'), B = 8, W = 40, H = 15;
  const sky = ['#6b9cf0','#6b9cf0','#7aa8f4','#7aa8f4','#89b4f7','#98c0fa','#a8cbfc','#b6d4fd'];
  for (let j = 0; j < H; j++){ x.fillStyle = sky[Math.min(sky.length - 1, j)]; x.fillRect(0, j * B, 320, B); }
  x.fillStyle = '#fff3a0'; x.fillRect(268, 10, 18, 18); x.fillStyle = '#ffe760'; x.fillRect(271, 13, 12, 12);
  x.fillStyle = 'rgba(255,255,255,.92)';
  [[20,10,6,2],[90,18,8,2],[180,6,5,2],[250,30,7,2]].forEach(([cx, cy, w, h]) => {
    const ox = ((cx + t * .4) % 380) - 40;
    x.fillRect(ox, cy, w * B, h * 5); x.fillRect(ox + B, cy - 5, (w - 3) * B, 5);
  });
  const surf = [];
  for (let i = 0; i < W; i++) surf[i] = 7 + Math.round(Math.sin(i / 5) * 1.2 + Math.sin(i / 2.1 + 1) * .6);
  for (let i = 0; i < W; i++) for (let j = surf[i]; j < H; j++){
    const d = j - surf[i];
    const key = d === 0 ? 'grassSide' : d <= 2 ? 'dirt' : d <= 4 ? 'clay' : j < H - 1 ? 'stone' : 'deep';
    x.drawImage(tex8(key)[(i + j) % 2], i * B, j * B);
  }
  [[4, 3], [35, 4]].forEach(([tx, th]) => {
    const top = surf[tx];
    for (let k = 1; k <= th; k++) x.drawImage(tex8('log')[0], tx * B, (top - k) * B);
    for (let a = -1; a <= 1; a++) for (let b = 0; b < 2; b++) x.drawImage(tex8('leaves')[(a + b + 2) % 2], (tx + a) * B, (top - th - 1 - b) * B);
  });
  const spr = (type, i, depth) => x.drawImage(spriteCanvas(ITEMS[type].rows, ITEMS[type].colors, 1), i * B - 1, (surf[i] + depth) * B - 1);
  spr('vaso', 9, 4); spr('moneta', 27, 3); spr('freccia', 19, 5); spr('scarabeo', 31, 5); spr('civetta', 14, 3);
  [['paul', 16], ['laura', 19], ['muhammad', 22]].forEach(([id, i]) => x.drawImage(charCanvas(id, 1), i * B - 2, surf[i] * B - 18));
}

let mapCtx = null, mapState = null, mapData = null;
function phaseSito(){
  S.phase = 'sito';
  const md = S.mission.map;
  mapData = md.build();
  view.innerHTML = `
    <div class="map-wrap">
      <div>
        <canvas id="map" width="320" height="200" aria-label="Mappa della zona: ${md.zones.map(z => `${z.z} ${z.label}`).join(', ')}"></canvas>
        <div class="zones" id="zones">${md.zones.map(z => `<button type="button" data-z="${z.z}">Zona ${z.z} · ${z.label}</button>`).join('')}</div>
      </div>
      <div class="side panel">
        <h2>Gli indizi</h2>
        <div class="stack" id="srcs">${md.sources.map((s, i) => `<button type="button" data-i="${i}">${s.label}</button>`).join('')}</div>
        <p class="hint">Guarda gli indizi, poi scegli la zona dove scavare.</p>
      </div>
    </div>`;
  mapState = { seen:md.sources.map(() => false), blink:true };
  mapCtx = $('map').getContext('2d');
  drawMap();
  mapTimer = setInterval(() => { mapState.blink = !mapState.blink; drawMap(); }, 500);
  $('srcs').querySelectorAll('button').forEach(b => b.onclick = () => {
    const s = md.sources[+b.dataset.i];
    sfx.blip(); mapState.seen[+b.dataset.i] = true; b.classList.add('done'); drawMap();
    talk(s.lines.map(l => [s.who, l]));
  });
  $('zones').querySelectorAll('button').forEach(b => b.onclick = () => chooseZone(b.dataset.z));
  say('paul', md.start);
}
function chooseZone(z){
  const md = S.mission.map, zone = md.zones.find(q => q.z === z);
  if (!zone.ok){ sfx.bad(); say(zone.who, zone.msg); return; }
  if (!mapState.seen.some(Boolean)){ sfx.bad(); say('paul', 'Un buon archeologo non sceglie a caso: guarda almeno un indizio prima di decidere!'); return; }
  clearInterval(mapTimer); mapTimer = null; sfx.find();
  talk(md.okLines, phaseQuadretti);
}
function drawMap(){
  const x = mapCtx, M = mapData.M, md = S.mission.map, B = 8;
  for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) x.drawImage(tex8(TILEKEY[M[j][i]])[(i * 7 + j * 13) % 2], i * B, j * B);
  md.sources.forEach((s, k) => {
    if (!mapState.seen[k]) return;
    const fx = s.fx;
    if (fx[0] === 'blink' && mapState.blink){
      x.fillStyle = 'rgba(255,255,85,.55)';
      for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) if (M[j][i] === fx[1]) x.fillRect(i * B, j * B, B, B);
    } else if (fx[0] === 'marks'){
      x.fillStyle = fx[2]; fx[1].forEach(([a, b, w, h]) => x.fillRect(a * B, b * B, w * B, h * B));
    } else if (fx[0] === 'dots'){
      const list = typeof fx[1] === 'string' ? mapData[fx[1]] : fx[1], sz = fx[3];
      x.fillStyle = fx[2]; list.forEach(([a, b]) => x.fillRect(Math.round(a * B + B / 2 - sz / 2), Math.round(b * B + B / 2 - sz / 2), sz, sz));
    } else if (fx[0] === 'rings'){
      x.fillStyle = fx[3];
      fx[1].forEach(([cx, cy]) => { for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++)
        if (Math.abs(Math.hypot(i - cx, j - cy) - fx[2]) < .55) x.fillRect(i * B + 1, j * B + 1, B - 2, B - 2); });
    } else if (fx[0] === 'box' && mapState.blink){
      const [a, b, w, h] = fx[1];
      x.strokeStyle = '#ffff55'; x.lineWidth = 2; x.strokeRect(a * B + 1, b * B + 1, w * B - 2, h * B - 2);
    }
  });
  Object.entries(md.labels).forEach(([t, [lx, ly]]) => {
    x.fillStyle = '#000'; x.fillRect(lx * B, ly * B, 14, 14);
    x.fillStyle = '#fff'; x.font = '10px "Press Start 2P", monospace'; x.textBaseline = 'top'; x.fillText(t, lx * B + 2, ly * B + 3);
  });
}

function gridMarkup(){
  return `
    <div class="frame">
      <div class="cols lbl-hidden" id="colLbl">${L.map(l => `<span>${l}</span>`).join('')}</div>
      <div class="rows lbl-hidden" id="rowLbl">${[1,2,3,4,5,6].map(n => `<span>${n}</span>`).join('')}</div>
      <div class="area" id="area"></div>
    </div>`;
}
const SHADOWS = [
  'inset 3px 3px 0 rgba(255,255,255,.22), inset -3px -3px 0 rgba(0,0,0,.3)',
  'inset 4px 4px 0 rgba(0,0,0,.38), inset -2px -2px 0 rgba(255,255,255,.08)',
  'inset 7px 7px 0 rgba(0,0,0,.45), inset -2px -2px 0 rgba(255,255,255,.06)',
  'inset 10px 10px 0 rgba(0,0,0,.55)'
];
function paintCell(b, d){
  b.style.setProperty('--img', `url(${tex16(layerTex(d))})`);
  b.style.setProperty('--sh', SHADOWS[d]);
}
function buildCells(onClick){
  const area = $('area'); area.innerHTML = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'cell';
    b.dataset.c = c; b.dataset.r = r; b.setAttribute('aria-label', 'Quadretto ' + coord(c, r));
    paintCell(b, 0);
    b.addEventListener('click', () => onClick(c, r, b));
    area.appendChild(b);
  }
}
const cellEl = (c, r) => document.querySelector(`.cell[data-c="${c}"][data-r="${r}"]`);
let quadTasks = [];
function phaseQuadretti(){
  S.phase = 'quadretti';
  view.innerHTML = `<div class="dig"><div>${gridMarkup()}</div>
    <div class="side panel"><h2>La quadrettatura</h2>
    <p class="hint">Con lo spago dividiamo il terreno in quadretti. Così sapremo sempre dove abbiamo trovato ogni oggetto.</p></div></div>`;
  quadTasks = [];
  buildCells(quadClick);
  const area = $('area'); let set = 0;
  ['tl','tr','bl','br'].forEach(p => {
    const peg = document.createElement('button'); peg.type = 'button'; peg.className = 'peg ' + p;
    peg.setAttribute('aria-label', 'Picchetto da piantare');
    peg.onclick = () => {
      if (peg.classList.contains('set')) return;
      peg.classList.add('set'); sfx.dig(); set++;
      if (set === 4) stringGrid();
      else say('muhammad', `Picchetto piantato! Ne mancano ${4 - set}.`);
    };
    area.appendChild(peg);
  });
  talk([['muhammad', 'Piantiamo 4 picchetti agli angoli del terreno. Clicca sui quadratini di legno che lampeggiano!']]);
}
function stringGrid(){
  say('muhammad', 'Ora tendiamo lo spago tra i picchetti...');
  setTimeout(() => {
    if (!S || S.phase !== 'quadretti') return;
    $('area').classList.add('strung'); $('colLbl').classList.remove('lbl-hidden'); $('rowLbl').classList.remove('lbl-hidden');
    sfx.ok();
    const tasks = progress.tut ? [[1 + rnd(6), rnd(6)]] : [[2, 3], [5, 1]];
    quadTasks = tasks.slice();
    const first = coord(tasks[0][0], tasks[0][1]);
    talk([['muhammad', 'Ecco i quadretti! Ognuno ha una lettera (la colonna) e un numero (la riga).'],
          ['laura', `Proprio come a battaglia navale! Proviamo: clicca il quadretto ${first}.`]], () => { S.quadReady = true; });
  }, reduce ? 0 : 900);
}
function quadClick(c, r, b){
  if (!S.quadReady || !quadTasks.length) return;
  const [tc, tr] = quadTasks[0];
  if (c === tc && r === tr){
    sfx.ok(); b.classList.add('target'); quadTasks.shift(); S.quadReady = false;
    if (quadTasks.length){
      const nx = coord(quadTasks[0][0], quadTasks[0][1]);
      talk([['laura', `Bravo! Quello è ${coord(c, r)}. Adesso trova il quadretto ${nx}.`]], () => { S.quadReady = true; });
    } else {
      progress.tut = true; saveProgress();
      talk([['laura', `Perfetto, ${coord(c, r)}! Sei pronto per lo scavo vero e proprio.`]], phaseScavo);
    }
  } else {
    sfx.bad(); b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 300);
    say('laura', `Quello è ${coord(c, r)}. Cerca prima la lettera in alto, poi il numero a sinistra: ${coord(tc, tr)}.`);
  }
}

function makeActors(){
  const layer = document.createElement('div'); layer.className = 'actors'; layer.id = 'actors';
  $('area').appendChild(layer);
  actors = {}; busyCells = new Set();
  TEAM.forEach(t => {
    const el = document.createElement('div'); el.className = 'actor';
    const bub = document.createElement('div'); bub.className = 'bubble'; bub.hidden = true;
    const img = document.createElement('img'); img.className = 'sp'; img.alt = t.name; img.src = FRAMES[t.id].idle;
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = t.name;
    el.append(bub, img, tag); layer.appendChild(el);
    actors[t.id] = { id:t.id, x:HOME[t.id][0], y:HOME[t.id][1], face:1, el, img, bub, busy:false, bubT:null };
    placeActor(actors[t.id]);
  });
}
function resetActors(){
  TEAM.forEach(t => { const a = actors[t.id]; if (!a) return; a.x = HOME[t.id][0]; a.y = HOME[t.id][1]; a.face = 1; a.busy = false; setFrame(a, 'idle'); placeActor(a); });
  busyCells = new Set();
}
function placeActor(a){
  a.el.style.left = (a.x * 12.5) + '%';
  a.el.style.top = ((a.y + 1) * 100 / 6) + '%';
  a.el.style.zIndex = 10 + Math.round(a.y * 10);
  a.img.style.transform = a.face < 0 ? 'scaleX(-1)' : '';
  a.el.classList.toggle('sel', S.sel === a.id);
}
function renderSel(){ Object.values(actors).forEach(placeActor); }
function setFrame(a, f){ a.img.src = FRAMES[a.id][f]; }
function bubble(a, text, ms){
  a.bub.textContent = text; a.bub.hidden = false; clearTimeout(a.bubT);
  a.bub.classList.toggle('edge-l', a.x < 2); a.bub.classList.toggle('edge-r', a.x > 5.5);
  a.bubT = setTimeout(() => { a.bub.hidden = true; }, ms || 1600);
}
function walkTo(a, tx, ty, done){
  const speed = 2.6; let last = performance.now(), ft = 0, step = false;
  if (Math.abs(tx - a.x) > .05) a.face = tx > a.x ? 1 : -1;
  const game = S;
  function tick(now){
    if (S !== game || S.phase !== 'scavo') return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy), mv = speed * dt;
    if (dist <= mv || reduce){ a.x = tx; a.y = ty; setFrame(a, 'idle'); placeActor(a); done(); return; }
    a.x += dx / dist * mv; a.y += dy / dist * mv;
    ft += dt; if (ft > .13){ ft = 0; step = !step; setFrame(a, step ? 'walk' : 'idle'); }
    placeActor(a); requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function dirt(c, r, color){
  const layer = $('actors'); if (!layer || reduce) return;
  for (let i = 0; i < 6; i++){
    const d = document.createElement('i'); d.className = 'dirt';
    d.style.left = ((c + .3 + Math.random() * .4) * 12.5) + '%';
    d.style.top = ((r + .4 + Math.random() * .3) * 100 / 6) + '%';
    d.style.background = color;
    d.style.setProperty('--dx', (Math.random() * 36 - 18) + 'px');
    d.style.setProperty('--dy', (-12 - Math.random() * 22) + 'px');
    layer.appendChild(d); setTimeout(() => d.remove(), 650);
  }
}
function digAnim(a, c, r, done){
  const strokes = reduce ? 1 : 5; let i = 0; const game = S;
  const iv = setInterval(() => {
    if (S !== game || S.phase !== 'scavo'){ clearInterval(iv); return; }
    const down = i % 2 === 1;
    setFrame(a, down ? 'dig2' : 'dig1');
    if (down){ const pal = PAL[layerTex(S.depth[c][r])] || PAL.dirt; dirt(c, r, pal[1]); tone(120 + rnd(40), .05, 0, 'triangle'); }
    i++;
    if (i >= strokes * 2){ clearInterval(iv); setFrame(a, 'idle'); done(); }
  }, 210);
}
function renderGrid(){
  const m = S.mission;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const b = cellEl(c, r), d = S.depth[c][r];
    paintCell(b, d);
    [...b.querySelectorAll('img, .flag')].forEach(n => n.remove());
    b.setAttribute('aria-label', 'Quadretto ' + coord(c, r) + (d < 3 ? ', strato ' + (d + 1) + ', ' + m.layers[d].short : ', scavo finito'));
    const p = S.pendings.find(x => x.col === c && x.row === r);
    if (p){ b.appendChild(itemImg(p.type, 'pending')); b.setAttribute('aria-label', 'Reperto da pulire e documentare in ' + coord(c, r)); }
    if (S.finds.some(f => f.documented && isTarget(f.type) && f.col === c && f.row === r)){
      const fl = document.createElement('span'); fl.className = 'flag'; b.appendChild(fl);
    }
    const hinted = S.hints.some(h => (h.t === 'zone' && Math.abs(h.c - c) <= 1 && Math.abs(h.r - r) <= 1) || (h.t === 'col' && h.c === c) || (h.t === 'row' && h.r === r));
    b.classList.toggle('hint-on', hinted);
    b.classList.toggle('digging', busyCells.has(c + ',' + r));
  }
}
function selectActor(id){
  if (!teamOf(id)) return;
  S.sel = id; sfx.blip(); renderCards(); renderSel();
  const a = actors[id], g = teamOf(id).g;
  if (a) bubble(a, a.busy ? 'Sto scavando!' : S.energy[id] <= 0 ? 'Sono stanc' + g + '...' : 'Pront' + g + '!', 1100);
}
function abilityName(id){
  const m = S.mission;
  return id === 'paul' ? 'Leggi le fonti' : id === 'laura' ? 'Fiuto per ' + m.targets[0].short : 'Fiuto per ' + m.targets[1].short;
}
function renderCards(){
  const box = $('cards'); if (!box) return; box.innerHTML = '';
  TEAM.forEach(t => {
    const a = actors[t.id];
    const status = a && a.busy ? 'sta scavando…' : S.energy[t.id] <= 0 ? 'stanc' + t.g + ' per oggi' : 'pront' + t.g;
    const card = document.createElement('div'); card.className = 'card' + (S.sel === t.id ? ' sel' : '');
    card.setAttribute('role', 'button'); card.tabIndex = 0;
    card.setAttribute('aria-label', `Scegli ${t.name}, ${status}, colpi rimasti ${S.energy[t.id]}`);
    card.appendChild(charCanvas(t.id, 3));
    const info = document.createElement('div');
    info.innerHTML = `<div class="nm">${t.name}</div><div class="fr">${status}</div>
      <div class="pips">${Array.from({length:6}, (_, i) => `<span class="${i < S.energy[t.id] ? '' : 'off'}"></span>`).join('')}</div>`;
    const ab = document.createElement('button'); ab.type = 'button'; ab.textContent = abilityName(t.id);
    ab.title = t.id === 'paul' ? 'Mostra una zona dove c’è un reperto' : t.id === 'laura' ? 'Mostra una colonna' : 'Mostra una riga';
    ab.disabled = !!S.used[t.id];
    ab.onclick = e => { e.stopPropagation(); useAbility(t.id); };
    info.appendChild(ab); card.appendChild(info);
    card.onclick = () => selectActor(t.id);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectActor(t.id); } };
    box.appendChild(card);
  });
}
document.addEventListener('keydown', e => {
  if (!S || S.phase !== 'scavo' || document.querySelector('.modal') || e.target.tagName === 'INPUT') return;
  const map = { '1':'paul', '2':'laura', '3':'muhammad' };
  if (map[e.key]) selectActor(map[e.key]);
});
function useAbility(id){
  if (S.used[id]) return;
  const a = actors[id], m = S.mission;
  if (id === 'paul'){
    const left = S.finds.filter(f => isTarget(f.type) && !f.found);
    if (!left.length){ say('paul', 'Le fonti non hanno più segreti: abbiamo già trovato tutto!'); return; }
    const f = left[rnd(left.length)]; S.hints.push({ t:'zone', c:f.col, r:f.row });
    say('paul', 'Ho riletto le fonti: qui intorno è nascosto un reperto importante! Guarda i quadretti azzurri.');
  } else {
    const t = id === 'laura' ? m.targets[0] : m.targets[1];
    const left = S.finds.filter(f => f.type === t.type && !f.found);
    if (!left.length){ say(id, `Abbiamo già trovato ${t.all}!`); return; }
    const f = left[rnd(left.length)];
    if (id === 'laura'){ S.hints.push({ t:'col', c:f.col }); say('laura', `Io me ne intendo: ${t.one} si nasconde nella colonna ${L[f.col]}!`); }
    else { S.hints.push({ t:'row', r:f.row }); say('muhammad', `Secondo i miei appunti c’è ${t.one} nella riga ${f.row + 1}!`); }
  }
  if (a) bubble(a, 'Ho un’idea!', 1400);
  S.used[id] = true; sfx.ok(); renderGrid(); renderCards();
}
const totalEnergy = () => S.energy.paul + S.energy.laura + S.energy.muhammad;
const anyBusy = () => Object.values(actors).some(a => a.busy);
function digClick(c, r){
  const pend = S.pendings.find(p => p.col === c && p.row === r);
  if (pend){ openScheda(pend); return; }
  if (S.pendings.length){
    const p = S.pendings[0]; sfx.bad();
    say('muhammad', `Fermi tutti! Prima puliamo e documentiamo il reperto nel quadretto ${coord(p.col, p.row)}. Cliccaci sopra.`); return;
  }
  if (busyCells.has(c + ',' + r)){ sfx.bad(); say(S.sel, `Qualcuno sta già scavando nel quadretto ${coord(c, r)}!`); return; }
  if (S.depth[c][r] >= 3){ sfx.bad(); say('laura', `Il quadretto ${coord(c, r)} è finito: abbiamo già scavato tutti i suoi strati.`); return; }
  let a = actors[S.sel];
  if (a.busy || S.energy[a.id] <= 0){
    const other = TEAM.map(t => actors[t.id]).find(x => !x.busy && S.energy[x.id] > 0);
    if (!other){
      sfx.bad();
      say(S.sel, totalEnergy() === 0 ? 'Abbiamo finito i colpi di oggi: aspettiamo che finisca l’ultimo scavo.' : 'Siamo tutti al lavoro! Aspetta che qualcuno finisca.');
      return;
    }
    a = other; S.sel = other.id;
  }
  S.energy[a.id]--; a.busy = true; busyCells.add(c + ',' + r); sfx.blip();
  bubble(a, 'Vado in ' + coord(c, r) + '!', 1300);
  renderCards(); renderSel(); renderGrid();
  const sx = c > 0 ? c - .55 : c + .55;
  walkTo(a, sx, r, () => {
    a.face = sx < c ? 1 : -1; placeActor(a);
    digAnim(a, c, r, () => finishDig(a, c, r));
  });
}
function finishDig(a, c, r){
  busyCells.delete(c + ',' + r); a.busy = false; S.dugTotal++; S.dugToday++;
  const d = S.depth[c][r], m = S.mission;
  const f = S.finds.find(x => !x.found && x.col === c && x.row === r && x.layer === d + 1);
  if (f){
    f.found = true; S.pendings.push(f); sfx.find();
    bubble(a, 'Ho trovato qualcosa!', 2600);
    S.hints = S.hints.filter(h => !(isTarget(f.type) && h.t === 'zone' && Math.abs(h.c - c) <= 1 && Math.abs(h.r - r) <= 1));
    say(a.id, isTarget(f.type)
      ? `Ehi! Nel quadretto ${coord(c, r)} spunta qualcosa... ${m.msg.foundT} Clicca il reperto: prima lo puliamo col pennello.`
      : `Nel quadretto ${coord(c, r)} c’è un oggetto! Clicca il reperto per pulirlo e fare la scheda.`);
  } else {
    S.depth[c][r] = d + 1;
    const nd = d + 1;
    if (nd < 3 && !S.reached[nd + 1]){
      S.reached[nd + 1] = true;
      say(a.id, nd + 1 === 2 ? m.msg.reach2 : m.msg.reach3);
    }
    const lines = nd === 3 ? ['Quadretto finito!', 'Niente qui.'] : ['Strato tolto!', 'Solo terra...', 'Scendiamo piano piano', 'Niente, per ora'];
    bubble(a, lines[rnd(lines.length)], 1500);
  }
  if (S.energy[a.id] <= 0 && S.sel === a.id){ const o = TEAM.find(t => S.energy[t.id] > 0 && !actors[t.id].busy); if (o) S.sel = o.id; }
  renderGrid(); renderCards(); renderSel(); maybeEndDay();
}
function maybeEndDay(){
  const ready = () => S && S.phase === 'scavo' && totalEnergy() === 0 && !S.pendings.length && !anyBusy() && !document.querySelector('.modal');
  if (ready()) setTimeout(() => { if (ready()) endDay(); }, 900);
}

/* =========================================================
   SCHEDA DEL REPERTO
   ========================================================= */
function openModal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet panel" role="dialog" aria-modal="true">${html}</div>`;
  $('screen').appendChild(m); return m;
}
function openScheda(f){
  const it = ITEMS[f.type], mi = S.mission;
  const n = S.finds.filter(x => x.documented).length + 1;
  const right = coord(f.col, f.row);
  const opts = new Set([right]);
  while (opts.size < 3){
    const c = Math.max(0, Math.min(7, f.col + rnd(5) - 2)), r = Math.max(0, Math.min(5, f.row + rnd(5) - 2));
    opts.add(coord(c, r));
  }
  const coordOpts = [...opts].sort(() => Math.random() - .5);
  const groundUrl = tex16(mi.layers[f.layer - 1].tex);
  const m = openModal(`
    <h2>Scheda reperto n. ${n}</h2>
    <div id="brushStep">
      <p>Il reperto è ancora sporco di terra. Passa il pennello: trascina il dito o il mouse sopra la terra.</p>
      <div class="brush"><canvas id="bItem" width="160" height="160"></canvas><canvas id="bDirt" width="160" height="160" aria-label="Terra da spazzolare"></canvas></div>
      <div class="bar"><span id="bProg"></span></div>
      <div class="act" style="justify-content:center"><button type="button" id="bBtn">Usa il pennello</button></div>
    </div>
    <div id="docStep" hidden>
      <div class="photo">
        <div class="frame-img blank" id="ph"></div>
        <div><p><b>${it.name}</b></p><p>Ora che è pulito, rispondi alle domande e scatta la foto.</p></div>
      </div>
      <p class="fact"><b>Lo sapevi?</b> ${it.fact}</p>
      <div class="q">In quale quadretto l’hai trovato?</div>
      <div class="opts" id="q1">${coordOpts.map(o => `<button type="button" data-v="${o}">${o}</button>`).join('')}</div>
      <div class="q">In quale strato?</div>
      <div class="opts" id="q2">${mi.layers.map((l, i) => `<button type="button" data-v="${i + 1}">Strato ${i + 1} · ${l.short}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
      <div class="act"><button type="button" id="shot" disabled>Scatta la foto</button><button type="button" id="save" disabled>Salva la scheda</button></div>
    </div>`);
  // --- pennello ---
  const bi = m.querySelector('#bItem').getContext('2d');
  bi.imageSmoothingEnabled = false;
  const gimg = new Image(); gimg.src = groundUrl;
  const paintItem = () => { bi.drawImage(gimg, 0, 0, 160, 160); bi.drawImage(spriteCanvas(it.rows, it.colors, 12), 20, 20); };
  if (gimg.complete) paintItem(); else gimg.onload = paintItem;
  const dc = m.querySelector('#bDirt'), dx = dc.getContext('2d');
  const pal = PAL[mi.layers[f.layer - 1].tex] || PAL.dirt;
  for (let j = 0; j < 160; j += 8) for (let i = 0; i < 160; i += 8){ dx.fillStyle = pal[rnd(pal.length)]; dx.fillRect(i, j, 8, 8); }
  dx.fillStyle = 'rgba(0,0,0,.28)'; dx.fillRect(0, 0, 160, 160);
  let cleaned = false, lastSnd = 0;
  const prog = m.querySelector('#bProg');
  function measure(){
    const d = dx.getImageData(0, 0, 160, 160).data; let clear = 0, tot = 0;
    for (let y = 12; y < 148; y += 4) for (let x = 12; x < 148; x += 4){ tot++; if (d[(y * 160 + x) * 4 + 3] < 100) clear++; }
    const pct = clear / tot; prog.style.width = Math.min(100, pct / .65 * 100) + '%';
    if (pct >= .65 && !cleaned){
      cleaned = true; dx.clearRect(0, 0, 160, 160); sfx.ok();
      setTimeout(() => { m.querySelector('#brushStep').hidden = true; m.querySelector('#docStep').hidden = false; m.querySelector('#q1 button').focus(); }, reduce ? 0 : 600);
    }
  }
  function brushAt(x, y){
    dx.save(); dx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 4; i++) dx.fillRect(Math.round((x - 12 + rnd(24)) / 4) * 4, Math.round((y - 12 + rnd(24)) / 4) * 4, 12, 12);
    dx.restore();
    const now = performance.now(); if (now - lastSnd > 90){ lastSnd = now; tone(1400 + rnd(900), .02, 0, 'triangle'); }
  }
  let down = false;
  const pos = e => { const r = dc.getBoundingClientRect(); return [(e.clientX - r.left) * 160 / r.width, (e.clientY - r.top) * 160 / r.height]; };
  dc.addEventListener('pointerdown', e => { if (cleaned) return; down = true; dc.setPointerCapture(e.pointerId); brushAt(...pos(e)); measure(); });
  dc.addEventListener('pointermove', e => { if (!down || cleaned) return; brushAt(...pos(e)); measure(); });
  dc.addEventListener('pointerup', () => { down = false; });
  m.querySelector('#bBtn').onclick = () => { if (cleaned) return; for (let i = 0; i < 16; i++) brushAt(12 + rnd(136), 12 + rnd(136)); measure(); };
  // --- documentazione ---
  const ph = m.querySelector('#ph');
  const cv = spriteCanvas(it.rows, it.colors, 8); cv.style.backgroundImage = `url(${groundUrl})`; ph.appendChild(cv);
  const fb = m.querySelector('#fb'); let ok1 = false, ok2 = false;
  const check = () => { m.querySelector('#shot').disabled = !(ok1 && ok2); };
  m.querySelectorAll('#q1 button').forEach(b => b.onclick = () => {
    if (ok1) return;
    if (b.dataset.v === right){ ok1 = true; b.classList.add('ok'); sfx.ok(); fb.textContent = 'Giusto!'; }
    else { b.classList.add('no'); sfx.bad(); fb.textContent = 'Guarda la lettera in alto e il numero a sinistra del reperto che lampeggia.'; }
    check();
  });
  m.querySelectorAll('#q2 button').forEach(b => b.onclick = () => {
    if (ok2) return;
    if (+b.dataset.v === f.layer){
      ok2 = true; b.classList.add('ok'); sfx.ok();
      fb.textContent = f.layer === 3 ? mi.msg.fb3 : f.layer === 2 ? mi.msg.fb2 : 'Giusto! È nello strato più in alto, quindi è un oggetto di oggi.';
    } else { b.classList.add('no'); sfx.bad(); fb.textContent = 'Guarda il blocco del quadretto e confrontalo con la legenda degli strati.'; }
    check();
  });
  m.querySelector('#shot').onclick = () => {
    sfx.photo(); ph.classList.remove('blank');
    const fl = document.createElement('div'); fl.className = 'flash'; m.appendChild(fl); setTimeout(() => fl.remove(), 600);
    m.querySelector('#shot').disabled = true; m.querySelector('#save').disabled = false; m.querySelector('#save').focus();
  };
  m.querySelector('#save').onclick = () => { m.remove(); saveFind(f); };
  m.querySelector('#bBtn').focus();
}
function saveFind(f){
  const mi = S.mission;
  f.documented = true; f.day = S.day; S.pendings = S.pendings.filter(x => x !== f); S.todayFinds.push(f);
  S.depth[f.col][f.row] = Math.min(3, S.depth[f.col][f.row] + 1);
  sfx.ok(); renderHud(); renderGrid(); renderCards();
  const mu = actors.muhammad; if (mu) bubble(mu, 'Click! Scheda salvata', 1500);
  const missing = mi.targets.map(t => ({ t, left:leftOf(t.type) })).filter(x => x.left > 0);
  if (!missing.length){ setTimeout(finish, 500); return; }
  if (isTarget(f.type)){
    const list = missing.map(x => `${x.left} ${x.left === 1 ? x.t.sing : x.t.plur}`).join(' e ');
    say('muhammad', `Reperto documentato! Ci mancano ancora: ${list}.`);
  } else {
    say('paul', f.layer === 1 ? 'Non è antico: è un oggetto di oggi! Ma lo documentiamo lo stesso, ogni oggetto racconta qualcosa.' : mi.msg.decoy2);
  }
  maybeEndDay();
}

/* =========================================================
   GIORNALE DI SCAVO
   ========================================================= */
function diaryHtml(dayNum, dug, finds){
  const items = finds.length
    ? `<ul>${finds.map(f => `<li>${ITEMS[f.type].name} nel quadretto ${coord(f.col, f.row)}, strato ${f.layer}.</li>`).join('')}</ul>
       <div class="sketches">${finds.map(f => `<img class="sp slot" src="${IMG[f.type]}" alt="${ITEMS[f.type].name}">`).join('')}</div>`
    : `<p>Oggi niente reperti, ma ora conosciamo meglio il terreno.</p>`;
  return `<div class="diary"><p>Giorno ${dayNum}. Oggi la squadra ha tolto ${dug} strati di terra.</p>${items}</div>`;
}
function endDay(){
  if (!S || S.phase !== 'scavo' || document.querySelector('.modal')) return;
  S.allDays.push({ day:S.day, dug:S.dugToday, finds:S.todayFinds.slice() });
  const m = openModal(`<h2>Giornale di scavo</h2>
    <p>${playerName ? 'Il diario di ' + escapeHtml(playerName) : 'Il diario della squadra'}: tutto ciò che è successo oggi.</p>
    ${diaryHtml(S.day, S.dugToday, S.todayFinds)}
    <div class="act"><button type="button" id="sleep">Inizia il giorno ${S.day + 1}</button></div>`);
  sfx.blip();
  m.querySelector('#sleep').focus();
  m.querySelector('#sleep').onclick = () => {
    m.remove(); S.day++; S.energy = { paul:6, laura:6, muhammad:6 }; S.used = {}; S.hints = [];
    S.dugToday = 0; S.todayFinds = []; resetActors(); renderHud(); renderGrid(); renderCards(); renderSel();
    say('laura', `Buongiorno! È il giorno ${S.day}. Abbiamo di nuovo tutti i colpi di pala e i nostri aiuti speciali.`);
  };
}

/* =========================================================
   FINE MISSIONE
   ========================================================= */
function finish(){
  const mi = S.mission;
  S.phase = 'fine';
  S.allDays.push({ day:S.day, dug:S.dugToday, finds:S.todayFinds.slice() });
  sfx.win();
  const stars = S.day <= 3 ? 3 : S.day <= 4 ? 2 : 1;
  const best = Math.max(stars, progress.stars[mi.id] || 0);
  progress.stars[mi.id] = best; saveProgress();
  const others = S.finds.filter(f => f.documented && !isTarget(f.type)).length;
  const got = mi.targets.map(t => `${t.n} ${t.n === 1 ? t.sing : t.plur}`).join(' e ');
  const next = MISSIONS.find(x => x.num === mi.num + 1);
  const m = openModal(`<h2>Missione compiuta!</h2>
    <p>Fantastico, ${escapeHtml(displayName())}! Hai trovato ${got} in ${S.day} giorn${S.day === 1 ? 'o' : 'i'} di scavo.</p>
    <div class="stars" aria-label="${stars} stelle su 3">${starsHtml(stars)}</div>
    <p>Strati scavati: ${S.dugTotal}. Altri oggetti documentati: ${others}.</p>
    <p class="fact"><b>Cosa hai imparato:</b> ${mi.msg.end}</p>
    <h2 style="margin-top:14px">Giornale di scavo</h2>
    ${S.allDays.map(d => diaryHtml(d.day, d.dug, d.finds)).join('')}
    <div class="act">
      <button type="button" id="again">Rigioca</button>
      <button type="button" id="toMenu">Tutte le missioni</button>
      ${next ? `<button type="button" class="green" id="next">Missione ${next.num} ›</button>` : ''}
    </div>`);
  m.querySelector('#again').onclick = () => { m.remove(); startMission(mi); };
  m.querySelector('#toMenu').onclick = () => { m.remove(); missionMenu(); };
  if (next) m.querySelector('#next').onclick = () => { m.remove(); startMission(next); };
  (m.querySelector('#next') || m.querySelector('#toMenu')).focus();
  say('paul', `Thank you, ${displayName()}! Hai scavato strato dopo strato e documentato tutto: sei un vero detective del passato!`);
}

showLoading();
})();
</script>
</body>
</html>
